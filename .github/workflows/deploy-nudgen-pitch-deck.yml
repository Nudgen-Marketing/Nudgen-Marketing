name: Deploy Nudgen Pitch Deck to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - nudgen-pitch-deck.html
      - .github/workflows/deploy-nudgen-pitch-deck.yml
      - assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site artifact
        run: |
          mkdir -p site
          cp hackathon-pitch.html site/
          cp nudgen-pitch-deck.html site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Nudgen Decks</title>
            </head>
            <body>
              <h1>Nudgen Pitch Decks</h1>
              <ul>
                <li><a href="./hackathon-pitch.html">Hackathon Pitch</a></li>
                <li><a href="./nudgen-pitch-deck.html">Nudgen Pitch Deck</a></li>
              </ul>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
