name: Deploy Hackathon Pitch to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - hackathon-pitch.html
      - .github/workflows/deploy-hackathon-pitch.yml
      - assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static site artifact
        run: |
          mkdir -p site
          # Default route (/) serves nudgen-pitch-deck.html
          cp nudgen-pitch-deck.html site/index.html
          cp nudgen-pitch-deck.html site/nudgen-pitch-deck.html
          
          # /hackathon route serves hackathon-pitch.html
          cp hackathon-pitch.html site/hackathon.html
          mkdir -p site/hackathon
          cp hackathon-pitch.html site/hackathon/index.html
          
          # Keep original filename for backward compatibility
          cp hackathon-pitch.html site/hackathon-pitch.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
